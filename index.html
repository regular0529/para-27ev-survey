<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>27EV 심층 설문</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:dark;--canvas:#000;--soft:#0d0d0d;--card:#1a1a1a;--elev:#262626;--line:#3c3c3c;--white:#fff;--body:#bbb;--strong:#e6e6e6;--muted:#7e7e7e;--err:#ff5a4d;--stripe:linear-gradient(90deg,#0066b1 0 33.33%,#1c69d4 33.33% 66.66%,#e22718 66.66%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--canvas);color:var(--body);font:300 16px/1.5 "Pretendard Variable",Pretendard,Inter,-apple-system,"Segoe UI","Malgun Gothic",sans-serif}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg,none) center/cover no-repeat;opacity:.2}
h1,h2,h3{color:var(--white);font-weight:700;text-transform:uppercase;margin:0}
.label{font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--white);margin:0 0 8px}
.head{position:sticky;top:0;z-index:3;background:var(--canvas)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;min-height:64px;padding:8px 24px}
.top img{height:24px;display:block}
#step{font-size:14px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--white)}
#stat{margin-left:auto;font-size:14px;color:var(--muted)}
.stripe{height:4px;background:var(--stripe)}
.bar{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;height:2px;background:var(--canvas)}
.bar i{background:var(--elev)}
.bar i.on{background:var(--white)}
#cover{position:relative;display:flex;align-items:flex-end;min-height:calc(100vh - 70px);min-height:calc(100svh - 70px);overflow:hidden}
#cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover-box{position:relative;background:var(--canvas);padding:40px;max-width:720px}
#cover h1{font-size:80px;line-height:1;margin-bottom:24px}
.wrap h2{font-size:56px;line-height:1.05;margin-bottom:40px}
.wrap{max-width:1040px;margin:0 auto;padding:40px 24px 16px}
.item{margin-bottom:40px}
.q{font-size:18px;font-weight:700;color:var(--white);margin:0 0 12px}
.req{color:var(--err);margin-left:4px}
.note{font-size:14px;color:var(--body);margin:-4px 0 12px}
.err{font-size:14px;color:var(--err);margin:8px 0 0}
.err:empty{display:none}
input[type=text],input[type=tel],input[type=date],select,textarea{width:100%;min-height:48px;font:inherit;color:var(--white);background:var(--card);border:1px solid var(--line);border-radius:0;padding:12px 16px}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--white)}
textarea{resize:vertical}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.list{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;min-height:48px;padding:12px 16px;background:var(--card);border:1px solid var(--line);color:var(--strong);cursor:pointer}
.opt input{margin:4px 0 0;flex:none;width:16px;height:16px;accent-color:var(--white)}
.opt:has(input:checked){border-color:var(--white);background:var(--elev);color:var(--white)}
.opt:has(input:focus-visible){outline:1px solid var(--white);outline-offset:2px}
.list .opt:last-child:has([data-k$="_na"]){background:transparent;color:var(--body)}
.list+input{margin-top:8px}
.opt.rh{align-items:center;cursor:default}
.rh select{width:auto;min-height:0;padding:2px 8px}
button{font-family:inherit;font-size:14px;font-weight:700;line-height:1;letter-spacing:1.5px;text-transform:uppercase;color:var(--white);background:transparent;border:1px solid var(--white);border-radius:0;min-height:48px;padding:16px 32px;cursor:pointer}
button:disabled{opacity:.5}
button:focus-visible{outline:2px solid var(--white);outline-offset:2px}
button.ghost{border-color:transparent;color:var(--body);padding:16px 12px}
.nav{display:flex;flex-wrap:wrap;gap:8px;max-width:1040px;margin:0 auto;padding:0 24px 96px}
.nav .main{margin-left:auto}
.parts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.7fr);gap:40px;align-items:start}
.team{font-size:12px;font-weight:700;letter-spacing:1.5px;color:var(--body);margin:24px 0 4px}
.team:first-child{margin-top:0}
.chips{display:grid}
.chip{width:100%;min-height:44px;padding:12px 16px;text-align:left;font-size:16px;font-weight:400;letter-spacing:0;line-height:1.25;color:var(--body);border:0;border-bottom:1px solid var(--line)}
.chip.cur{color:var(--white);box-shadow:inset 4px 0 0 var(--white)}
.chip.picked{color:var(--white);font-weight:700;background:var(--elev)}
.panel{position:sticky;top:90px;scroll-margin-top:80px;background:var(--card);padding-bottom:8px}
.panel>:not(.media){margin-left:24px;margin-right:24px}
.panel h3{font-size:40px;line-height:1.1;margin-top:24px;margin-bottom:8px}
.panel p{margin-top:0;margin-bottom:16px}
.panel .opts button{flex:1 1 180px;padding:16px 8px}
.panel button.on{background:var(--white);color:#000}
.media{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px}
.slide{position:relative;width:100%;height:100%;background:var(--canvas)}
.slide>*{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border:0;display:block}
.slide img[src*="account"]{object-fit:contain;background:#fff}
.arrow{position:absolute;top:50%;margin-top:-24px;width:48px;height:48px;min-height:48px;padding:0;border:0;border-radius:50%;background:var(--card);font-size:20px;letter-spacing:0}
.arrow.prev{left:12px}
.arrow.next{right:12px}
.count{position:absolute;right:0;bottom:0;padding:4px 12px;background:var(--canvas);color:var(--white);font-size:12px;font-weight:700;letter-spacing:1.5px}
.picks{font-size:14px;color:var(--body)}
@media (prefers-reduced-motion:no-preference){.panel>*{animation:fade .25s ease-out}@keyframes fade{from{opacity:0;transform:translateY(4px)}}.slide>*{animation:fadein 1.2s ease-in-out both}.slide>.out{animation:fadeout 1.2s ease-in-out both}@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}}
.grid{width:100%;border-collapse:collapse;user-select:none;-webkit-user-select:none;font-size:12px}
.grid th{color:var(--body);font-weight:400;padding:4px}
.grid td{border:1px solid var(--line);height:32px;background:var(--card);touch-action:none;cursor:pointer}
.grid td.on{background:var(--white)}
.grid td:focus-visible{outline:2px solid var(--white);outline-offset:-2px}
@media (max-width:767px){
  .top{padding:8px 16px}
  #stat{font-size:12px}
  #cover{display:block;min-height:0}
  #cover img{position:static;height:40vh;object-position:center;display:block}
  .cover-box{padding:24px 16px;max-width:100%;width:100%}
  #cover h1{font-size:48px}
  .wrap h2{font-size:32px;margin-bottom:24px}
  .wrap{padding:24px 16px 8px}
  .nav{padding:0 16px 64px}
  .nav button{padding:16px 16px}
  .nav .ghost{padding:16px 8px}
  .parts{grid-template-columns:minmax(0,1fr);gap:24px}
  .panel{position:static;order:-1}
  .panel h3{font-size:28px}
  .chips{grid-template-columns:1fr 1fr;gap:0 8px}
  .grid td{height:40px}
}
</style>
</head>
<body>
<main id="app">
<div class="head">
  <div class="top"><img src="logo-white.png" alt="PARA"><span id="step">27EV</span><span id="stat"></span></div>
  <div class="stripe"></div>
  <div class="bar" id="bar"></div>
</div>
<section id="cover">
  <picture><source media="(prefers-reduced-motion:no-preference)" srcset="img/hero-drive.webp"><img src="img/hero.jpg" alt=""></picture>
  <div class="cover-box">
    <p class="label">PARA 2027 EV Team</p>
    <h1>Team Build<br>Survey</h1>
    <button type="button" id="start">시작하기 →</button>
  </div>
</section>
<div id="secs"></div>
<section id="done" hidden>
  <div class="wrap">
    <p class="label">Submitted</p>
    <h2>제출했습니다</h2>
    <p id="doneTime"></p>
    <p class="note">같은 브라우저로 다시 열면 작성한 내용이 남아 있습니다. 고친 뒤 다시 제출하면 최신 내용으로 바뀝니다.</p>
    <button type="button" id="edit">수정하기</button>
  </div>
</section>
<div class="nav" id="nav" hidden>
  <button type="button" class="ghost" id="prev">이전</button>
  <button type="button" class="ghost" id="draft">저장하기</button>
  <button type="button" class="main" id="next">다음</button>
</div>
</main>
<script>
// Code.gs 배포 후 웹 앱 URL을 붙여 넣는다. 비어 있으면 테스트 모드(전송 내용을 콘솔에만 출력)
const ENDPOINT = 'https://script.google.com/macros/s/AKfycbyrTXoky7eHjEmASvUaLpna5FUBQc1KrY3GeLd58F6P4p33N0nHH1-gQs-WUY8GIGhL/exec';

const PARTS = [['섀시',['프레임','현가장치','제동장치','조향장치','구동계']],['외장',['에어로']],['전장',['배터리','모터제어','회로설계','배선']],['전략',['전략','스폰서쉽','마케팅','회계','드라이버']],['제작',['제작']]];
// 파트 소개: 파트명: ['설명', [이미지·mp4 경로 또는 유튜브 링크 여러 개]]. 설명은 초안이니 팀 실정에 맞게 고친다
const COUNT = {frame:7, susp:5, brake:3, steer:4, drive:3, aero:5, battery:6, motor:6, pcb:6, wire:6, strategy:6, marketing:6, account:5, driver:6, build:6};
const pics = k => [...Array(COUNT[k])].map((_, i) => `img/p/${k}-${i}.jpg`);
const INFO = {
  프레임: ['차체의 뼈대. 튜브 프레임을 설계하고 지그에 맞춰 용접합니다.', pics('frame')],
  현가장치: ['타이어가 노면을 놓치지 않도록 암과 쇼크의 지오메트리를 설계하고 세팅합니다.', ['img/steer-clip.webp', ...pics('susp')]],
  제동장치: ['디스크와 캘리퍼로 차를 안전하게 멈추는 시스템을 설계하고 검증합니다.', ['img/brake-stop1.webp', 'img/brake-stop2.webp', ...pics('brake')]],
  조향장치: ['랙 앤 피니언부터 스티어링 휠까지, 드라이버의 입력을 바퀴로 전달합니다.', ['img/steer-8b.webp', ...pics('steer')]],
  구동계: ['모터의 힘을 체인과 드라이브 샤프트로 바퀴에 전달합니다.', pics('drive')],
  에어로: ['카울과 공력 부품을 설계하고 복합재로 제작합니다.', pics('aero')],
  배터리: ['고전압 배터리 팩과 BMS를 설계하고 측정하며 관리합니다.', pics('battery')],
  모터제어: ['듀얼 모터를 제어하고 주행 로그로 세팅을 다듬습니다.', pics('motor')],
  회로설계: ['차량에 들어가는 PCB를 설계하고 납땜해 검증합니다.', pics('pcb')],
  배선: ['고전압과 저전압 하네스를 설계하고 차량에 깔끔하게 배치합니다.', pics('wire')],
  전략: ['주행 데이터를 분석해 대회 운영과 에너지 전략을 세웁니다.', pics('strategy')],
  스폰서쉽: ['실제 기업과 단체를 대상으로 스폰서 계약을 유치, 유지하기 위한 사업활동 및 기술영업을 합니다.', ['img/p/marketing-3.jpg', ...[0,1,2,3].map(i => `img/p/sponsor-${i}.jpg`)]],
  마케팅: ['스폰서쉽이 원활하게 이루어지도록 동아리의 대외홍보 및 외장 디자인, 데칼, 랩핑을 수행합니다.', pics('marketing').filter((_, i) => i !== 3)],
  회계: ['예산을 관리하고 대회 비용보고서를 작성합니다.', pics('account')],
  드라이버: ['차를 몰고 대회에 출전하며, 주행 감각을 팀에 피드백합니다.', pics('driver')],
  제작: ['가공, 용접, 조립을 맡는 제작 실무 팀입니다.', pics('build')],
};
// 섹션 영문 소제목
const BANDS = ['Basic info','Your part','Experience','Skills','Availability','Finish'];
// 열 ID의 can_m/can_e/can_d 접두어는 화면에 안 보이지만, 나중에 분야별 다각형 그래프 합산에 쓴다
const CAN = [
  ['can_m_1','SolidWorks·CATIA 등으로 부품을 처음부터 모델링할 수 있다'],
  ['can_m_2','어셈블리와 가공 도면을 만들 수 있다'],
  ['can_m_3','ANSYS 등으로 구조해석을 해 본 적 있다'],
  ['can_m_4','선반·밀링·용접 등 공작기계를 다뤄 본 적 있다'],
  ['can_m_5','카본 등 복합재 적층을 해 본 적 있다'],
  ['can_m_6','3D 프린터로 부품을 출력해 본 적 있다'],
  ['can_e_1','납땜으로 회로를 직접 완성해 본 적 있다'],
  ['can_e_2','커넥터 압착이나 배선 작업을 해 본 적 있다'],
  ['can_e_3','회로도나 PCB를 설계해 본 적 있다'],
  ['can_e_4','Arduino·ESP32·STM32 코드를 작성해 본 적 있다'],
  ['can_e_5','CAN·UART·I2C 통신을 다뤄 본 적 있다'],
  ['can_e_6','멀티미터·오실로스코프로 측정해 본 적 있다'],
  ['can_e_7','고전압 작업 안전수칙을 알고 있다'],
  ['can_d_1','Python으로 데이터를 불러와 그래프를 그릴 수 있다'],
  ['can_d_2','엑셀 수식과 피벗으로 표를 정리할 수 있다'],
  ['can_d_3','예산이나 회계 업무를 해 본 적 있다'],
  ['can_d_4','보고서나 발표자료를 혼자 완성할 수 있다'],
  ['can_d_5','작업 절차서(SOP)나 매뉴얼을 작성해 본 적 있다'],
  ['can_d_6','포토샵·일러스트·Figma로 디자인물을 만들 수 있다'],
  ['can_d_7','영상 편집이나 SNS 운영을 해 본 적 있다'],
];
const WANT = ['새로운 부품을 설계하고 싶다','직접 가공·제작·조립을 하고 싶다','테스트하고 데이터를 분석하고 싶다','일정·문서·예산 관리를 맡고 싶다','SOP·매뉴얼처럼 일하는 방법을 정리하는 걸 좋아한다','작업장 정리, 공구·재고 관리 같은 환경관리를 맡고 싶다','팀을 이끄는 디렉터를 맡고 싶다','드라이버로 대회에 출전하고 싶다'].map((t,i)=>['want_'+(i+1),t]);
const DAYS = [...'월화수목금토일'], HOURS = [...Array(13)].map((_,i)=>String(9+i).padStart(2,'0'));
const MONTHS = [...Array(14)].map((_,i)=>{const d=new Date(2026,10+i);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')});

const ev26 = () => v.ev26 === '참가함';
const driver = () => v.want_8 == 1 || v.pref1 === '드라이버' || v.pref2 === '드라이버';
const S = [
  {t:'기본정보', q:[
    {id:'name', l:'이름', type:'text'},
    {id:'sid', l:'학번', type:'num', ph:'숫자만 입력'},
    {id:'birth', l:'생년월일', type:'date', ph:'YYYY-MM-DD'},
    {id:'major', l:'전공', type:'text'},
    {id:'club_years', l:'동아리 활동 몇 년차인가요? (비활동·군입대 기간 제외)', type:'num', ph:'숫자만 입력'},
    {id:'phone', l:'전화번호', type:'tel', ph:'010-0000-0000'},
    {id:'emergency', l:'비상연락처 (관계 포함)', type:'text', ph:'010-0000-0000 (어머니)'},
    {id:'blood', l:'혈액형', type:'blood', note:'사고 시 응급 대응과 경진대회 참가자 명단 작성에 필요합니다.'},
    {id:'llm', l:'LLM 유료 구독 여부', type:'radio', opts:['구독함','안 함']},
    {id:'llm_model', l:'주로 쓰는 모델', type:'text', req:()=>v.llm==='구독함', note:'구독함을 골랐다면 필수입니다.'},
    {id:'military', l:'군필 여부', type:'radio', opts:['군필','미필','해당 없음']},
  ]},
  {t:'희망 파트', q:[
    {id:'pref', l:'희망 파트 1순위와 2순위를 골라 주세요', type:'parts'},
  ]},
  {t:'경험', q:[
    {id:'race_exp', l:'대학생 자작차 대회 참가 경험', type:'radio', opts:['있음','없음']},
    {id:'ev26', l:'2026 EV 대회 참가 여부', type:'radio', opts:['참가함','참가 안 함']},
    {id:'ev26_part', l:'26EV에서 활동한 파트', type:'radio', opts:['프레임','서스','에어로','구동','듀얼모터','배터리','마케팅','총무','드라이버','기타'], show:ev26},
    {id:'ev26_task', l:'26EV에서 수행한 구체적인 업무', type:'long', show:ev26},
    {id:'ev26_good', l:'26EV가 훌륭했다고 생각하는 점', type:'long', show:ev26},
    {id:'ev26_improve', l:'26EV에서 개선이 필요하다고 느낀 점', type:'long', show:ev26},
    {id:'maker', l:'공학교육혁신센터, 앵커사업단, 부산공유대학, 팀 프로젝트 등 비교과 프로젝트 활동에 참가한 적이 있다면 무엇을 했고, 어떤 역할을 했는지, 성과는 어땠는지 작성해 주십시오.', type:'long', req:false, ph:'예: 2025 캡스톤, 라인트레이서 제작 (회로 담당)'},
  ]},
  {t:'역량·관심', q:[
    {id:'can', l:'할 수 있는 것을 모두 골라 주세요', type:'block', opts:CAN},
    {id:'want', l:'하고 싶은 것을 모두 골라 주세요', type:'block', opts:WANT},
    {id:'drv_license', l:'운전면허', type:'radio', opts:['없음','2종','1종'], show:driver},
    {id:'drv_exp', l:'카트·서킷·짐카나 주행 경험', type:'radio', opts:['없음','1~2회','정기적'], show:driver},
    {id:'drv_sim', l:'시뮬레이터 연습 가능 횟수', type:'radio', opts:['주 0회','1회','2회','3회 이상'], show:driver},
  ]},
  {t:'활동 제약', q:[
    {id:'scope', l:'2027년 활동 범위', type:'radio', opts:['EV만','EV + 포뮬러','미정']},
    {id:'leave', l:'대회 전까지 졸업·군입대·교환학생·인턴 예정', type:'radio', opts:['없음','있음']},
    {id:'leave_type', l:'예정 종류', type:'multi', opts:['졸업','군입대','교환학생','인턴'], show:()=>v.leave==='있음'},
    {id:'leave_when', l:'예정 시기', type:'select', opts:MONTHS, show:()=>v.leave==='있음'},
    {id:'avail', l:'학기 중 활동 가능 시간', type:'grid', note:'가능한 칸을 누르거나 드래그하세요. 한 칸은 1시간입니다 (09 = 09:00~10:00).'},
  ]},
  {t:'마무리', q:[
    {id:'expect', l:'27EV를 통해 가장 얻고 싶은 것 (최대 2개)', type:'multi', opts:['실무 경험','포트폴리오','대회 수상','사람·네트워크','진로 탐색','기타'], max:2, etc:true},
    {id:'comment', l:'하고 싶은 말이나 건의사항', type:'long', req:false},
  ]},
];

const KEY = 'ev27_survey';
let v = {}, cur = 0, fp = null;
try { ({v = {}, cur = 0} = JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const all = S.flatMap(s => s.q), byId = Object.fromEntries(all.map(it => [it.id, it]));

function keys(it) {
  if (it.type === 'block') return [...it.opts, [it.id+'_na', '해당 사항 없음']];
  if (it.type === 'multi') return it.opts.map(o => [it.id+'_'+o.replace(/\s/g,''), o]);
  if (it.type === 'grid') return HOURS.flatMap(h => DAYS.map(d => ['avail_'+d+'_'+h]));
  return null;
}
const cols = it => it.type === 'parts' ? ['pref1','pref2'] : keys(it) ? [...keys(it).map(x => x[0]), ...(it.etc ? [it.id+'_etc'] : [])] : [it.id];
const count = it => keys(it).filter(([k]) => v[k] == 1).length;
const isReq = it => typeof it.req === 'function' ? it.req() : it.req !== false;

function body(it) {
  const k = it.id;
  switch (it.type) {
    case 'text': case 'num': case 'tel': case 'date':
      return `<input data-k="${k}" aria-labelledby="q_${k}" type="${it.type==='tel'?'tel':'text'}" ${it.type==='text'?'':'inputmode="numeric"'} value="${esc(v[k])}" placeholder="${it.ph||''}">`;
    case 'long': return `<textarea data-k="${k}" aria-labelledby="q_${k}" rows="3" placeholder="${it.ph||''}">${esc(v[k])}</textarea>`;
    case 'radio': return `<div class="opts">${it.opts.map(o => `<label class="opt"><input type="radio" name="${k}" data-k="${k}" value="${o}" ${v[k]===o?'checked':''}>${o}</label>`).join('')}</div>`;
    case 'blood': {
      const [t, rh] = String(v[k] ?? '').split(' RH');
      return `<div class="opts">${['A','B','O','AB','모름'].map(o => `<label class="opt"><input type="radio" name="${k}" data-k="${k}" value="${o}" ${t===o?'checked':''}>${o}</label>`).join('')}<label class="opt rh" ${t==='모름'?'hidden':''}>RH <select data-k="${k}_rh" aria-label="RH 부호"><option ${rh==='−'?'':'selected'}>+</option><option ${rh==='−'?'selected':''}>−</option></select></label></div>`;
    }
    case 'select': return `<select data-k="${k}" aria-labelledby="q_${k}"><option value="">선택</option>${it.opts.map(o => `<option ${v[k]===o?'selected':''}>${o}</option>`).join('')}</select>`;
    case 'multi': case 'block':
      return `<div class="list">${keys(it).map(([kk,t]) => `<label class="opt"><input type="checkbox" data-k="${kk}" ${v[kk]==1?'checked':''}>${t}</label>`).join('')}</div>`
        + (it.etc ? `<input type="text" aria-label="기타 내용" data-k="${k}_etc" value="${esc(v[k+'_etc'])}" placeholder="기타 내용" ${v[k+'_기타']==1?'':'hidden'}>` : '');
    case 'grid':
      return `<table class="grid"><tr><th></th>${DAYS.map(d => `<th>${d}</th>`).join('')}</tr>${HOURS.map(h => `<tr><th>${h}</th>${DAYS.map(d => {const c='avail_'+d+'_'+h; return `<td data-c="${c}" role="button" tabindex="${c==='avail_월_09'?0:-1}" aria-label="${d}요일 ${h}시" aria-pressed="${v[c]==1}" class="${v[c]==1?'on':''}"></td>`}).join('')}</tr>`).join('')}</table>`;
    case 'parts':
      return `<div class="parts"><div>${PARTS.map(([t,ps]) => `<p class="team">${t}</p><div class="chips">${ps.map(p => `<button type="button" class="chip" data-part="${p}">${p}</button>`).join('')}</div>`).join('')}</div><div class="panel"></div></div>`;
  }
}
const inner = it => `<p class="q" id="q_${it.id}">${it.l}${it.req===false?'':'<span class="req">*</span>'}</p>${it.note?`<p class="note">${it.note}</p>`:''}${body(it)}<p class="err" role="alert"></p>`;

function media(m, alt) {
  if (!m) return '영상·이미지 준비 중';
  const y = m.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/);
  if (y) return `<iframe src="https://www.youtube.com/embed/${y[1]}" allowfullscreen></iframe>`;
  return /\.(mp4|webm)$/i.test(m) ? `<video src="${esc(m)}" autoplay muted loop playsinline></video>` : `<img src="${esc(m)}" alt="${alt}">`;
}
// 움직이는 사진은 같은 주소면 처음부터 다시 재생되지 않아, 받아 둔 파일로 매번 새 주소를 만든다
const clips = {};
// 3초보다 긴 영상의 표시 시간(ms). 제동 영상은 두 번 반복될 만큼 보여 준다
const HOLD = {'img/steer-8b.webp': 5400, 'img/steer-clip.webp': 3700, 'img/brake-stop1.webp': 9700, 'img/brake-stop2.webp': 6700};
let slide = 0, nextAt = 0;
function showSlide(i) {
  const panel = wrap.pref.querySelector('.panel'), p = panel.dataset.p, ms = (INFO[p] || [])[1] || [];
  if (!ms.length) return;
  slide = (i + ms.length) % ms.length;
  const box = panel.querySelector('.slide');
  [...box.children].forEach(x => { x.classList.add('out'); setTimeout(() => { x.remove(); if (x.src?.startsWith('blob:')) URL.revokeObjectURL(x.src); }, 1200); });
  box.insertAdjacentHTML('beforeend', media(clips[ms[slide]] ? URL.createObjectURL(clips[ms[slide]]) : ms[slide], `${p} 사진 ${slide + 1}`));
  panel.querySelector('.count').textContent = `${slide + 1} / ${ms.length}`;
  nextAt = Date.now() + (HOLD[ms[slide]] || 3000);
}
// 3초마다 넘긴다. 화살표로 넘긴 뒤 8초, 다른 단계, 움직임 줄이기 설정에서는 멈춘다
setInterval(() => {
  if (matchMedia('(prefers-reduced-motion:reduce)').matches || document.hidden || wrap.pref.closest('section').hidden || Date.now() < nextAt) return;
  showSlide(slide + 1);
}, 200);
function drawParts(force) {
  const w = wrap.pref, p = fp || v.pref1 || '프레임', panel = w.querySelector('.panel');
  w.querySelectorAll('.chip').forEach(c => {
    const n = c.dataset.part;
    c.classList.toggle('cur', n === p);
    c.classList.toggle('picked', n === v.pref1 || n === v.pref2);
    c.textContent = n + (n === v.pref1 ? ' ①' : '') + (n === v.pref2 ? ' ②' : '');
  });
  if (force || panel.dataset.p !== p) {
    const [desc] = INFO[p] || [];
    panel.dataset.p = p;
    panel.innerHTML = `<div class="media"><div class="slide"></div><button type="button" class="arrow prev" data-slide="-1" aria-label="이전 사진">‹</button><button type="button" class="arrow next" data-slide="1" aria-label="다음 사진">›</button><span class="count"></span></div><h3>${p}</h3><p>${desc || '설명 준비 중'}</p><div class="opts"><button type="button" data-pick="1">1순위로 선택</button><button type="button" data-pick="2">2순위로 선택</button></div><p class="picks"></p>`;
    (INFO[p] || [[], []])[1].forEach(m => {
      if (!m.endsWith('.webp')) new Image().src = m;
      else if (!clips[m]) fetch(m).then(r => r.blob()).then(b => { clips[m] = b; });
    });
    showSlide(0);
  }
  panel.querySelectorAll('[data-pick]').forEach(b => b.classList.toggle('on', v['pref'+b.dataset.pick] === p));
  panel.querySelector('.picks').textContent = `1순위: ${v.pref1||'없음'} · 2순위: ${v.pref2||'없음'}`;
}

function check(it) {
  if (it.show && !it.show()) return '';
  switch (it.type) {
    case 'block': return count(it) ? '' : "하나 이상 체크하거나 '해당 사항 없음'을 골라 주세요";
    case 'multi':
      if (!count(it)) return isReq(it) ? '하나 이상 골라 주세요' : '';
      return it.etc && v[it.id+'_기타'] == 1 && !String(v[it.id+'_etc'] ?? '').trim() ? '기타 내용을 적어 주세요' : '';
    case 'grid': return count(it) ? '' : '가능한 시간을 1칸 이상 선택해 주세요';
    case 'parts': return v.pref1 && v.pref2 ? '' : '1순위와 2순위를 모두 골라 주세요';
  }
  const val = String(v[it.id] ?? '').trim();
  if (!val) return isReq(it) ? '필수 문항입니다' : '';
  if (it.type === 'tel' && !/^010-\d{4}-\d{4}$/.test(val)) return '010-0000-0000 형식으로 입력해 주세요';
  if (it.type === 'date' && !isDate(val)) return '2003-05-01처럼 실제 날짜를 입력해 주세요';
  return '';
}
const setErr = (it, msg) => { wrap[it.id].querySelector('.err').textContent = msg; };
function validate(i) {
  let first = null;
  for (const it of S[i].q) { const m = check(it); setErr(it, m); if (m && !first) first = wrap[it.id]; }
  if (first) first.scrollIntoView({block:'center', behavior:'smooth'});
  return !first;
}

function refresh() {
  for (const it of all) if (it.show) {
    const w = wrap[it.id], on = it.show();
    if (!on && !w.hidden) { cols(it).forEach(c => delete v[c]); w.innerHTML = inner(it); }
    w.hidden = !on;
  }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify({v, cur})); $('stat').textContent = '자동 저장됨 ' + new Date().toLocaleTimeString('ko-KR', {hour:'2-digit', minute:'2-digit'}); } catch {}
}
function dateHyphen(s) {
  const d = s.replace(/\D/g, '').slice(0, 8);
  return d.length < 5 ? d : d.length < 7 ? d.slice(0,4)+'-'+d.slice(4) : d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6);
}
function isDate(s) {
  const m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if (!m) return false;
  const d = new Date(+m[1], m[2] - 1, +m[3]);
  return +m[1] >= 1900 && d <= new Date() && d.getMonth() === m[2] - 1 && d.getDate() === +m[3];
}
function hyphen(s) {
  const d = s.replace(/\D/g, '').slice(0, 11);
  return d.length < 4 ? d : d.length < 8 ? d.slice(0,3)+'-'+d.slice(3) : d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7);
}

// 화면 만들기
const wrap = {};
$('secs').innerHTML = S.map((s, i) => `<section data-s="${i}" hidden><div class="wrap"><p class="label">0${i+1} / 0${S.length} ${BANDS[i]}</p><h2>${s.t}</h2>${s.q.map(it => `<div class="item" role="group" aria-labelledby="q_${it.id}" data-id="${it.id}">${inner(it)}</div>`).join('')}</div></section>`).join('');
document.querySelectorAll('.item').forEach(w => wrap[w.dataset.id] = w);
$('bar').innerHTML = S.map(() => '<i></i>').join('');

const app = $('app');
app.addEventListener('input', e => {
  const el = e.target, k = el.dataset.k, w = el.closest('.item');
  if (!k || !w) return;
  const it = byId[w.dataset.id];
  if (it.type === 'blood') {
    const t = w.querySelector('input:checked')?.value;
    w.querySelector('.rh').hidden = t === '모름';
    v.blood = !t ? '' : t === '모름' ? t : `${t} RH${w.querySelector('select').value}`;
  } else if (el.type === 'checkbox') {
    v[k] = el.checked ? 1 : 0;
    if (el.checked && it.type === 'block') {
      const na = it.id + '_na';
      w.querySelectorAll('input[type=checkbox]').forEach(x => { if ((k === na) !== (x.dataset.k === na)) { x.checked = false; v[x.dataset.k] = 0; } });
    }
    if (el.checked && it.max && count(it) > it.max) { el.checked = false; v[k] = 0; setErr(it, `최대 ${it.max}개까지 고를 수 있습니다`); return; }
    if (it.etc) { const t = w.querySelector(`[data-k="${it.id}_etc"]`); t.hidden = v[it.id+'_기타'] != 1; if (t.hidden) { t.value = ''; v[it.id+'_etc'] = ''; } }
  } else if (el.type === 'radio') v[k] = el.value;
  else {
    if (it.type === 'num') el.value = el.value.replace(/\D/g, '');
    if (it.type === 'tel') el.value = hyphen(el.value);
    if (it.type === 'date') el.value = dateHyphen(el.value);
    v[k] = el.value;
  }
  setErr(it, ''); refresh(); save();
});

// 희망 파트: 마우스를 올리거나 키보드로 옮기거나 누르면 소개, 버튼으로 순위 지정
for (const ev of ['mouseover', 'focusin']) app.addEventListener(ev, e => { const c = e.target.closest('[data-part]'); if (c) { fp = c.dataset.part; drawParts(); } });
app.addEventListener('click', e => {
  const c = e.target.closest('[data-part]'), b = e.target.closest('[data-pick]'), a = e.target.closest('[data-slide]');
  if (a) { showSlide(slide + +a.dataset.slide); nextAt = Math.max(nextAt, Date.now() + 8000); }
  if (c) {
    fp = c.dataset.part; drawParts();
    if (matchMedia('(max-width:767px)').matches) wrap.pref.querySelector('.panel').scrollIntoView({behavior:'smooth'});
  }
  if (b) { v['pref'+b.dataset.pick] = wrap.pref.querySelector('.panel').dataset.p; setErr(byId.pref, ''); drawParts(); refresh(); save(); }
});

// 시간 그리드 (when2meet 방식): 누른 칸의 반대 상태로, 누른 칸~현재 칸 사각형을 칠한다
let paint = null, start, snap;
const grid = wrap.avail.querySelector('.grid');
const pos = c => [c.parentNode.rowIndex, c.cellIndex];
function paintRect(c) {
  const [r1, c1] = start, [r2, c2] = pos(c);
  grid.querySelectorAll('td[data-c]').forEach(td => {
    const [r, cc] = pos(td), k = td.dataset.c;
    const on = r >= Math.min(r1, r2) && r <= Math.max(r1, r2) && cc >= Math.min(c1, c2) && cc <= Math.max(c1, c2) ? paint : snap[k] == 1;
    v[k] = on ? 1 : 0; td.classList.toggle('on', on); td.setAttribute('aria-pressed', on);
  });
}
// 키보드: 화살표로 이동, 스페이스·엔터로 칸 전환
grid.addEventListener('keydown', e => {
  const c = e.target.closest('td[data-c]'); if (!c) return;
  const [r, i] = pos(c), to = {ArrowUp:[r-1,i], ArrowDown:[r+1,i], ArrowLeft:[r,i-1], ArrowRight:[r,i+1]}[e.key];
  if (to) {
    e.preventDefault();
    const n = grid.rows[to[0]]?.cells[to[1]];
    if (n?.dataset.c) { c.tabIndex = -1; n.tabIndex = 0; n.focus(); }
  } else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault(); paint = v[c.dataset.c] != 1; start = pos(c); snap = {...v}; paintRect(c); paint = null; setErr(byId.avail, ''); save();
  }
});
grid.addEventListener('pointerdown', e => { const c = e.target.closest('td'); if (!c) return; e.preventDefault(); paint = v[c.dataset.c] != 1; start = pos(c); snap = {...v}; paintRect(c); });
grid.addEventListener('pointermove', e => { if (paint === null) return; const c = document.elementFromPoint(e.clientX, e.clientY)?.closest('td[data-c]'); if (c && grid.contains(c)) paintRect(c); });
addEventListener('pointerup', () => { if (paint === null) return; paint = null; setErr(byId.avail, ''); save(); });

function go(i) {
  cur = i;
  document.querySelectorAll('section[data-s]').forEach(s => s.hidden = +s.dataset.s !== i);
  document.body.style.setProperty('--bg', `url(img/bg${i}.jpg)`);
  $('cover').hidden = true; $('done').hidden = true; $('nav').hidden = false;
  $('step').textContent = `${i+1} / ${S.length} ${S[i].t}`;
  [...$('bar').children].forEach((b, j) => b.classList.toggle('on', j <= i));
  $('prev').hidden = i === 0;
  $('next').textContent = i === S.length - 1 ? '제출하기' : '다음';
  save(); scrollTo(0, 0);
}

function payload() {
  const d = {};
  for (const it of all) { const bin = keys(it)?.map(x => x[0]) || []; const off = it.show && !it.show(); for (const c of cols(it)) d[c] = (off ? null : v[c]) ?? (bin.includes(c) ? 0 : ''); }
  return d;
}
async function send(status) {
  const d = {status, ...payload()};
  if (!ENDPOINT) { console.log('테스트 모드 전송', d); window.lastPayload = d; return {ok:true, saved_at:new Date().toISOString()}; }
  const r = await fetch(ENDPOINT, {method:'POST', body:JSON.stringify(d)});
  return r.json();
}
const when = r => new Date(r.saved_at).toLocaleString('ko-KR');

$('prev').onclick = () => go(cur - 1);
$('next').onclick = async () => {
  if (!validate(cur)) return;
  if (cur < S.length - 1) return go(cur + 1);
  for (let i = 0; i < S.length; i++) if (!validate(i)) return go(i), validate(i);
  $('next').disabled = true; $('stat').textContent = '제출 중…';
  try {
    const r = await send('제출');
    if (!r.ok) throw r.error;
    document.querySelectorAll('section[data-s]').forEach(s => s.hidden = true);
    $('nav').hidden = true; $('done').hidden = false; document.body.style.setProperty('--bg', 'url(img/b7.jpg)');
    $('doneTime').textContent = '서버 기록 시각: ' + when(r);
    $('stat').textContent = '제출 완료'; scrollTo(0, 0);
  } catch (err) { $('stat').textContent = '제출 실패. 인터넷 연결을 확인하고 다시 눌러 주세요. 작성 내용은 이 브라우저에 남아 있습니다.'; console.error(err); }
  $('next').disabled = false;
};
$('draft').onclick = async () => {
  if (!v.name || !v.sid) { go(0); ['name','sid'].forEach(k => setErr(byId[k], check(byId[k]))); $('stat').textContent = '저장하려면 이름과 학번이 필요합니다'; return; }
  $('stat').textContent = '저장 중…';
  try { const r = await send('임시저장'); if (!r.ok) throw r.error; $('stat').textContent = '서버 저장됨 ' + when(r); }
  catch (err) { $('stat').textContent = '서버 저장 실패. 작성 내용은 이 브라우저에 남아 있습니다.'; console.error(err); }
};
$('edit').onclick = () => go(0);

refresh(); drawParts();
if (v.name || v.sid) $('start').textContent = '이어서 작성 →';
$('start').onclick = () => go(Math.min(cur, S.length - 1));
</script>
</body>
</html>
